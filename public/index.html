<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>HoopRun</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">

    <!-- Stylesheet -->
    <link rel="stylesheet" href="stylesheet.css">

    <!-- GSAP -->
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>

</head>

<body>

    <section class="hero">
        <div class="topbar">
            <div class="logo">HOOPRUN</div>
            <div class="profile">U</div>
        </div>

        <div class="hero-content">
            <div class="tag">🏀 Boise Pickup Games</div>

            <h1>
                Find Runs.<br />
                Pull Up.
            </h1>

            <p class="subtext">
                Join local basketball games, meet hoopers nearby,
                and never miss a good run again.
            </p>

            <button class="cta">Find Games Near Me</button>
        </div>
    </section>

    <section class="games-section">

        <div class="section-title">
            Tonight's Runs
        </div>

        <div class="game-card">
            <div class="court-name">
                Julia Davis Park
            </div>

            <div class="details">
                5v5 • Competitive • 7:30 PM
            </div>

            <div class="players">
                <div class="avatars">
                    <div class="avatar"></div>
                    <div class="avatar"></div>
                    <div class="avatar"></div>
                    <div class="avatar"></div>
                </div>

                <button class="join-btn">
                    Join
                </button>
            </div>
        </div>

        <div class="game-card">
            <div class="court-name">
                Boise State Rec Center
            </div>

            <div class="details">
                3v3 • Chill Runs • 9:00 PM
            </div>

            <div class="players">
                <div class="avatars">
                    <div class="avatar"></div>
                    <div class="avatar"></div>
                    <div class="avatar"></div>
                </div>

                <button class="join-btn">
                    Join
                </button>
            </div>
        </div>

    </section>

    <div class="bottom-nav">
        <div class="nav-item active">Home</div>
        <div class="nav-item">Games</div>
        <div class="nav-item">Courts</div>
        <div class="nav-item">Profile</div>
    </div>
    
    <!-- Place this before closing body tag -->
    <script src="main.js"></script>
</body>

</html>
