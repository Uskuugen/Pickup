<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>HoopRun</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">

    <!-- Stylesheet -->
    <link rel="stylesheet" href="stylesheet.css">

    <!-- GSAP -->
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>

</head>

<body>

    <section class="hero">
        <div class="topbar">
            <div class="logo">HOOPRUN</div>
            <div class="profile">U</div>
        </div>
        <div class="user-bar">
            Logged in as:
            <span id="current-user"></span>
            <button id="change-user-btn">
                Change
            </button>
        </div>

        <div class="hero-content">
            <div class="tag">🏀 Boise Pickup Games</div>

            <h1>
                Find Runs.<br />
                Pull Up.
            </h1>

            <p class="subtext">
                Join local basketball games, meet hoopers nearby,
                and never miss a good run again.
            </p>
        </div>
    </section>

    <section class="games-section">
        <div class="create-game-form">

            <h2>Host a Run</h2>

            <input type="text" id="court" placeholder="Court Name">

            <input type="text" id="type" placeholder="5v5">

            <input type="text" id="level" placeholder="Competitive">

            <input type="text" id="time" placeholder="7:30 PM">

            <input type="number" id="maxPlayers" placeholder="10">

            <input type="text" id="city" placeholder="City">

            <input type="text" id="state" placeholder="State">

            <button id="create-btn">
                Host Run
            </button>

        </div>

        <div class="section-title">
            Tonight's Runs
        </div>


        <div class="games-container"></div>

    </section>

    <div class="bottom-nav">
        <div class="nav-item active">Home</div>
        <div class="nav-item">Host</div>
        <div class="nav-item">Courts</div>
        <div class="nav-item">Me</div>
    </div>

    <!-- Place this before closing body tag -->
    <script src="main.js"></script>
</body>

</html>
