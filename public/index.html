<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>HoopRun</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">

    <!-- Stylesheet -->
    <link rel="stylesheet" href="stylesheet.css">

    <!-- GSAP -->
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>

</head>

<button id="scroll-latest-btn" class="scroll-latest hidden">
    ↓
</button>

<div id="toast" class="toast hidden">
    🏀 Game Created!
</div>

<body>

    <section class="hero">
        <div class="topbar">
            <div class="logo">HOOPRUN</div>
            <div class="profile">U</div>
        </div>
        <div class="user-bar">
            Logged in as:
            <span id="current-user"></span>
            <button id="change-user-btn">
                Change
            </button>
        </div>

        <div class="hero-content">
            <div class="tag">🏀 Boise Pickup Games</div>

            <h1>
                Find Runs.<br />
                Pull Up.
            </h1>

            <p class="subtext">
                Join local basketball games, meet hoopers nearby,
                and never miss a good run again.
            </p>
        </div>
    </section>

    <section class="games-section">
        <div class="create-game-form">

            <h2>Host a Run</h2>

            <input type="text" id="court" placeholder="Court Name">

            <label for="type">Game Type</label>

            <select id="type">
                <option>1v1</option>
                <option>2v2</option>
                <option>3v3</option>
                <option>4v4</option>
                <option selected>5v5</option>
                <option>Shooting Around</option>
            </select>

            <label for="level">Skill Level</label>

            <select id="level">
                <option value="Open">Open</option>
                <option value="Casual">Casual</option>
                <option value="Intermediate">Intermediate</option>
                <option value="Competitive">Competitive</option>
            </select>

            <input type="text" id="time" placeholder="7:30 PM">

            <button id="create-btn">
                Host Run
            </button>

        </div>

        <div class="section-title">
            Tonight's Runs
        </div>


        <div class="games-container"></div>

    </section>

    <div id="edit-modal" class="modal hidden">

        <div class="modal-content">

            <h2>Edit Run</h2>

            <input type="text" id="edit-court" placeholder="Court">

            <label for="edit-type">Game Type</label>
            <select id="edit-type">
                <option>1v1</option>
                <option>2v2</option>
                <option>3v3</option>
                <option>4v4</option>
                <option>5v5</option>
                <option>Shooting Around</option>
            </select>

            <label for="edit-level">Skill Level</label>
            <select id="edit-level">
                <option>Open</option>
                <option>Casual</option>
                <option>Intermediate</option>
                <option>Competitive</option>
            </select>

            <input type="text" id="edit-time" placeholder="7:30 PM">

            <div class="button-row">
                <button id="save-edit-btn">Save</button>
                <button id="cancel-edit-btn">Cancel</button>

            </div>
        </div>
    </div>
    <!-- Place this before closing body tag -->
    <script src="main.js"></script>
</body>

</html>
